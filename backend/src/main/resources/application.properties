spring.application.name=backend

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sih_cognitive
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

ml.service.url=${ML_SERVICE_URL:http://localhost:8001}
ml.service.connect-timeout-ms=${ML_SERVICE_CONNECT_TIMEOUT_MS:3000}
ml.service.read-timeout-ms=${ML_SERVICE_READ_TIMEOUT_MS:3000}
